<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Paseo de Cuento – Villarquemado</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --pink:       #e8547a;
            --pink-dark:  #b33059;
            --gold:       #d4a843;
            --gold-light: #f0d080;
            --cream:      #fdf8ef;
            --parchment:  #f5ead6;
            --forest:     #2d5a27;
            --ink:        #3a2618;
            --page-w: 340px;
            --page-h: 480px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            color: var(--ink);
            background: #1a1a2e;
            overflow-x: hidden;
        }

        /* ── FONDO ── */
        .bg-layer {
            position: fixed; inset: 0; z-index: -2;
            background:
                linear-gradient(160deg, #0d1b2a 0%, #1b2838 40%, #2d1f3d 100%);
        }

        .bg-forest {
            position: fixed; inset: 0; z-index: -1;
            background: url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&q=60&w=1200') center/cover;
            opacity: 0.18;
            filter: saturate(0.4) brightness(0.7);
        }

        /* Estrellas */
        .stars {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
        }
        @keyframes twinkle { from { opacity: 0.2; transform: scale(1); } to { opacity: 1; transform: scale(1.4); } }

        /* ── PARTÍCULAS ── */
        #particles {
            position: fixed; inset: 0; z-index: 1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            animation: drift linear infinite;
        }
        @keyframes drift {
            0%   { transform: translateY(-5vh) rotate(0deg) translateX(0);   opacity: 0; }
            8%   { opacity: 1; }
            100% { transform: translateY(105vh) rotate(400deg) translateX(30px); opacity: 0; }
        }

        /* ── HEADER ── */
        header {
            position: relative; z-index: 5;
            text-align: center;
            padding: 60px 20px 30px;
        }

        .header-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
            color: #5a3a00;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 6px 20px;
            border-radius: 50px;
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3.5rem, 10vw, 6.5rem);
            color: var(--gold-light);
            line-height: 1.1;
            text-shadow:
                0 0 40px rgba(212,168,67,0.5),
                0 2px 0 rgba(0,0,0,0.4);
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.65);
            margin-top: 12px;
            letter-spacing: 0.05em;
        }

        /* ── DIVISOR ORNAMENTAL ── */
        .ornament {
            display: flex; align-items: center; justify-content: center;
            gap: 12px;
            margin: 30px auto;
            color: var(--gold);
            font-size: 1.2rem;
            position: relative; z-index: 5;
        }
        .ornament::before, .ornament::after {
            content: '';
            flex: 1; max-width: 120px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold));
        }
        .ornament::after { background: linear-gradient(to left, transparent, var(--gold)); }

        /* ── MAPA ── */
        .map-section {
            position: relative; z-index: 5;
            display: flex; justify-content: center;
            padding: 0 20px 40px;
        }
        .map-frame {
            position: relative;
            max-width: 680px; width: 100%;
        }
        .map-frame::before {
            content: '';
            position: absolute; inset: -6px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
            z-index: -1;
        }
        .map-frame img {
            width: 100%;
            border-radius: 18px;
            display: block;
            filter: sepia(0.15) contrast(1.05);
        }

        /* ── TÍTULO LIBRO ── */
        .book-title {
            text-align: center;
            position: relative; z-index: 5;
            margin-bottom: 20px;
        }
        .book-title h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--gold-light);
            font-weight: 400;
        }

        /* ── LIBRO 3D ── */
        .scene {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; z-index: 5;
            padding: 40px 20px 10px;
            perspective: 2800px;
        }

        /* El libro como contenedor fijo */
        .book-3d {
            position: relative;
            width: calc(var(--page-w) * 2 + 12px);
            height: var(--page-h);
            transform-style: preserve-3d;
        }

        /* Lomo central */
        .spine {
            position: absolute;
            left: calc(var(--page-w) + 2px);
            top: 0;
            width: 8px;
            height: 100%;
            background: linear-gradient(to right, #8b5e3c, #c8924e, #8b5e3c);
            border-radius: 2px;
            z-index: 100;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Página izquierda (fija, muestra el "front" de la hoja ya girada) */
        .left-page {
            position: absolute;
            left: 0; top: 0;
            width: var(--page-w);
            height: var(--page-h);
            border-radius: 15px 0 0 15px;
            background: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            box-shadow:
                inset -8px 0 20px rgba(0,0,0,0.12),
                -4px 0 12px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            z-index: 1;
        }

        /* Página derecha (fija, muestra el "front" de la hoja actual) */
        .right-page {
            position: absolute;
            right: 0; top: 0;
            width: var(--page-w);
            height: var(--page-h);
            border-radius: 0 15px 15px 0;
            background: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            box-shadow:
                inset 8px 0 20px rgba(0,0,0,0.12),
                4px 0 12px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            z-index: 1;
        }

        /* Hoja que gira (el "flipping page") */
        .flip-page {
            position: absolute;
            right: 0; top: 0;
            width: var(--page-w);
            height: var(--page-h);
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 50;
            pointer-events: none;
        }

        .flip-page.flipping { transform: rotateY(-180deg); }

        .flip-front, .flip-back {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        .flip-front {
            background: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            border-radius: 0 15px 15px 0;
            box-shadow:
                inset 8px 0 20px rgba(0,0,0,0.12),
                4px 0 15px rgba(0,0,0,0.25);
        }

        .flip-back {
            background: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            transform: rotateY(180deg);
            border-radius: 15px 0 0 15px;
            box-shadow:
                inset -8px 0 20px rgba(0,0,0,0.12);
        }

        /* Sombra que aparece al girar */
        .flip-front::after {
            content: '';
            position: absolute; inset: 0;
            border-radius: inherit;
            background: linear-gradient(to left, rgba(0,0,0,0.15), transparent 60%);
            pointer-events: none;
        }

        /* Contenido de página */
        .page-video {
            width: 100%;
            border-radius: 10px;
            border: 3px solid rgba(212,168,67,0.4);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            background: #000;
        }

        .page-label {
            margin-top: 12px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1rem;
            color: var(--pink-dark);
            font-weight: 700;
            text-align: center;
        }

        .page-number {
            position: absolute;
            bottom: 10px;
            font-size: 0.7rem;
            color: rgba(100,60,30,0.4);
            font-family: 'Playfair Display', serif;
        }

        .page-ornament {
            font-size: 1.4rem;
            color: var(--gold);
            margin-bottom: 8px;
        }

        /* Tapas del libro */
        .cover-left {
            position: absolute;
            left: -22px; top: -6px;
            width: calc(var(--page-w) + 12px);
            height: calc(var(--page-h) + 12px);
            background: linear-gradient(135deg, #3d1f0a, #6b3520, #3d1f0a);
            border-radius: 18px 0 0 18px;
            z-index: 0;
            box-shadow: -6px 0 20px rgba(0,0,0,0.5);
        }
        .cover-right {
            position: absolute;
            right: -22px; top: -6px;
            width: calc(var(--page-w) + 12px);
            height: calc(var(--page-h) + 12px);
            background: linear-gradient(135deg, #3d1f0a, #6b3520, #3d1f0a);
            border-radius: 0 18px 18px 0;
            z-index: 0;
            box-shadow: 6px 0 20px rgba(0,0,0,0.5);
        }
        /* Detalle dorado en las tapas */
        .cover-left::after, .cover-right::after {
            content: '';
            position: absolute; inset: 10px;
            border: 1px solid rgba(212,168,67,0.3);
            border-radius: 10px;
        }

        /* Sombra bajo el libro */
        .book-shadow {
            position: absolute;
            bottom: -30px; left: 10%; right: 10%;
            height: 30px;
            background: radial-gradient(ellipse, rgba(0,0,0,0.5) 0%, transparent 70%);
        }

        /* ── CONTADOR ── */
        .page-counter {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-top: 8px;
            position: relative; z-index: 5;
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        /* ── BOTONES ── */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 30px 20px 50px;
            position: relative; z-index: 5;
        }

        .btn {
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            padding: 13px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-prev {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.85);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-prev:hover { background: rgba(255,255,255,0.18); transform: translateY(-2px); }

        .btn-next {
            background: linear-gradient(135deg, var(--pink), var(--pink-dark));
            color: white;
            box-shadow: 0 4px 20px rgba(232,84,122,0.4), 0 2px 0 #8b1a38;
        }
        .btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(232,84,122,0.5), 0 2px 0 #8b1a38; }
        .btn-next:active { transform: translateY(1px); box-shadow: 0 2px 12px rgba(232,84,122,0.3), 0 1px 0 #8b1a38; }
        .btn:disabled { opacity: 0.35; cursor: default; transform: none !important; }

        /* ── INVITACIÓN ── */
        .invitation-wrap {
            display: flex; justify-content: center;
            padding: 20px 20px 60px;
            position: relative; z-index: 5;
        }

        .invitation {
            max-width: 560px; width: 100%;
            position: relative;
            padding: 48px 44px;
            text-align: center;
        }

        /* Marco pergamino con capas */
        .invitation::before {
            content: '';
            position: absolute; inset: 0;
            background:
                linear-gradient(135deg, rgba(212,168,67,0.15), rgba(212,168,67,0.05)),
                url('https://www.transparenttextures.com/patterns/parchment.png');
            border-radius: 4px;
            border: 2px solid rgba(212,168,67,0.4);
            box-shadow:
                0 0 0 8px rgba(212,168,67,0.08),
                0 20px 60px rgba(0,0,0,0.4);
        }

        .invitation > * { position: relative; }

        .invitation h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: var(--gold);
            line-height: 1.1;
            margin-bottom: 24px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .invitation p {
            font-size: 1rem;
            color: rgba(60,30,10,0.9);
            margin: 8px 0;
            line-height: 1.6;
        }

        .invitation strong {
            color: var(--pink-dark);
            font-size: 1.05rem;
        }

        .inv-divider {
            width: 60px; height: 2px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
            margin: 20px auto;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 780px) {
            :root { --page-w: 155px; --page-h: 260px; }
            h1 { font-size: 3rem; }
            .book-3d { width: calc(var(--page-w) * 2 + 12px); }
            .cover-left { left: -10px; width: calc(var(--page-w) + 6px); }
            .cover-right { right: -10px; width: calc(var(--page-w) + 6px); }
            .page-label { font-size: 0.75rem; }
            .page-video { border-radius: 6px; }
            .invitation { padding: 32px 24px; }
            .invitation h2 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-forest"></div>
<div class="stars" id="stars"></div>
<div id="particles"></div>

<!-- HEADER -->
<header>
    <div class="header-badge">✦ Villarquemado ✦</div>
    <h1>Un Paseo de Cuento</h1>
    <p class="subtitle">Donde los cuentos clásicos cobran vida entre los árboles</p>
</header>

<div class="ornament">✦ ✦ ✦</div>

<!-- MAPA -->
<section class="map-section">
    <div class="map-frame">
        <img src="mapa.jpg" alt="Mapa del Parque de Cuentos de Villarquemado">
    </div>
</section>

<div class="ornament">🌿 📖 🌿</div>

<!-- TÍTULO LIBRO -->
<div class="book-title">
    <h2>Nuestros Personajes</h2>
</div>

<!-- LIBRO 3D -->
<div class="scene">
    <div class="book-3d" id="book3d">
        <div class="cover-left"></div>
        <div class="cover-right"></div>

        <!-- Página izquierda: siempre visible, muestra el video "anterior" -->
        <div class="left-page" id="leftPage">
            <div class="page-ornament">🌿</div>
            <video class="page-video" id="leftVideo" controls playsinline></video>
            <p class="page-label" id="leftLabel"></p>
            <span class="page-number" id="leftNum"></span>
        </div>

        <!-- Página derecha: siempre visible, muestra el video "actual" -->
        <div class="right-page" id="rightPage">
            <div class="page-ornament">🌿</div>
            <video class="page-video" id="rightVideo" controls playsinline></video>
            <p class="page-label" id="rightLabel"></p>
            <span class="page-number" id="rightNum"></span>
        </div>

        <!-- Lomo -->
        <div class="spine"></div>

        <!-- Hoja animada que gira -->
        <div class="flip-page" id="flipPage">
            <div class="flip-front" id="flipFront">
                <div class="page-ornament">🌿</div>
                <video class="page-video" id="flipFrontVideo" controls playsinline></video>
                <p class="page-label" id="flipFrontLabel"></p>
            </div>
            <div class="flip-back" id="flipBack">
                <div class="page-ornament">🌿</div>
                <video class="page-video" id="flipBackVideo" controls playsinline></video>
                <p class="page-label" id="flipBackLabel"></p>
            </div>
        </div>

        <div class="book-shadow"></div>
    </div>
</div>

<p class="page-counter" id="counter"></p>

<!-- CONTROLES -->
<div class="controls">
    <button class="btn btn-prev" id="btnPrev" onclick="prevPage()">← Anterior</button>
    <button class="btn btn-next" id="btnNext" onclick="nextPage()">Siguiente →</button>
</div>

<!-- INFORMACIÓN -->
<div class="invitation-wrap">
    <div class="invitation">
        <h2>Información</h2>
        <div class="inv-divider"></div>
        <p>🕙 Sábados y Domingos · 11:00 a 13:00</p>
        <div class="inv-divider"></div>
        <p>Menores de 3 años: <strong>Gratis</strong></p>
        <p>De 3 a 14 años: <strong>2 €</strong></p>
        <p>Adultos: <strong>5 €</strong></p>
        <div class="inv-divider"></div>
        <p>🏠 <strong>Empadronados en Villarquemado: Gratis</strong></p>
    </div>
</div>

<script>
// ─── DATOS ───────────────────────────────────────────────────────────────────
const videos = [
    { file: "cerdito.mp4",      name: "Los Tres Cerditos" },
    { file: "ratoncito.mp4",    name: "Ratoncito Pérez" },
    { file: "conejo.mp4",       name: "El Conejo" },
    { file: "hada.mp4",         name: "El Hada" },
    { file: "patitofeo.mp4",    name: "El Patito Feo" },
    { file: "pozo.mp4",         name: "El Pozo" },
    { file: "hanselgretel.mp4", name: "Hansel y Gretel" },
    { file: "buho.mp4",         name: "El Búho" },
    { file: "peon.mp4",         name: "El Peón" },
    { file: "caperucita.mp4",   name: "Caperucita" },
    { file: "enano.mp4",        name: "Blancanieves" },
    { file: "ratita.mp4",       name: "La Ratita" },
    { file: "peterpan.mp4",     name: "Peter Pan" },
    { file: "cenicienta.mp4",   name: "Cenicienta" },
    { file: "oz.mp4",           name: "El Mago de Oz" },
    { file: "pinocho.mp4",      name: "Pinocho" },
    { file: "rapunzel.mp4",     name: "Rapunzel" },
    { file: "ricitos.mp4",      name: "Ricitos de Oro" }
];

/*
    MODELO MENTAL — LIBRO REAL
    ══════════════════════════
    Cada HOJA física tiene dos caras: FRENTE y REVERSO.
    Las hojas se numeran 0, 1, 2 …

      Hoja 0 → frente = vídeo 0 | reverso = vídeo 1
      Hoja 1 → frente = vídeo 2 | reverso = vídeo 3
      Hoja 2 → frente = vídeo 4 | reverso = vídeo 5
      …

    El libro empieza con TODAS las hojas sin girar (apiladas a la derecha).
    Lo que se ve en cada momento:

      pagesTurned = 0  →  izquierda: vacía          | derecha: hoja0.frente (vídeo 0)
      pagesTurned = 1  →  izquierda: hoja0.reverso (vídeo 1) | derecha: hoja1.frente (vídeo 2)
      pagesTurned = 2  →  izquierda: hoja1.reverso (vídeo 3) | derecha: hoja2.frente (vídeo 4)
      …

    Fórmula:
      leftIdx  = pagesTurned === 0 ? null : (pagesTurned * 2) - 1
      rightIdx = pagesTurned * 2      (si existe)

    Al girar "Siguiente": la hoja que sale de la derecha tiene
      frente  = rightIdx  (= lo que ya se ve en la derecha, la hoja que va a girar)
      reverso = rightIdx + 1  (= el nuevo contenido que aparece en la izquierda)
    Tras girar: pagesTurned++  → nueva derecha = pagesTurned*2

    Al girar "Anterior": la hoja que vuelve tiene
      frente  = (pagesTurned-1)*2   (nuevo rightIdx tras decrementar)
      reverso = (pagesTurned-1)*2+1 = leftIdx actual
    Parte ya girada y se "desdobla" hacia la derecha.
*/

let pagesTurned = 0;
let isAnimating  = false;

const flipPage  = document.getElementById('flipPage');
const leftVid   = document.getElementById('leftVideo');
const leftLbl   = document.getElementById('leftLabel');
const leftNum   = document.getElementById('leftNum');
const rightVid  = document.getElementById('rightVideo');
const rightLbl  = document.getElementById('rightLabel');
const rightNum  = document.getElementById('rightNum');
const ffVideo   = document.getElementById('flipFrontVideo');
const ffLabel   = document.getElementById('flipFrontLabel');
const fbVideo   = document.getElementById('flipBackVideo');
const fbLabel   = document.getElementById('flipBackLabel');
const btnPrev   = document.getElementById('btnPrev');
const btnNext   = document.getElementById('btnNext');
const counter   = document.getElementById('counter');

function getSpread(turned) {
    const leftIdx  = turned === 0 ? null : turned * 2 - 1;
    const rightIdx = turned * 2 < videos.length ? turned * 2 : null;
    return { leftIdx, rightIdx };
}

// Número total de hojas (cada hoja tiene 2 vídeos)
const totalSheets = Math.ceil(videos.length / 2);

function applyToEl(videoEl, labelEl, numEl, idx) {
    if (idx === null || idx === undefined || idx >= videos.length) {
        videoEl.src = '';
        videoEl.load();
        labelEl.textContent = '';
        if (numEl) numEl.textContent = '';
    } else {
        videoEl.src = videos[idx].file;
        videoEl.load();
        labelEl.textContent = videos[idx].name;
        if (numEl) numEl.textContent = `${idx + 1} / ${videos.length}`;
    }
}

function renderSpread() {
    const { leftIdx, rightIdx } = getSpread(pagesTurned);
    applyToEl(leftVid,  leftLbl,  leftNum,  leftIdx);
    applyToEl(rightVid, rightLbl, rightNum, rightIdx);

    btnPrev.disabled = pagesTurned === 0;
    btnNext.disabled = pagesTurned >= totalSheets;

    if (rightIdx !== null && leftIdx !== null) {
        counter.textContent = `Vídeos ${leftIdx + 1} y ${rightIdx + 1} de ${videos.length}`;
    } else if (rightIdx !== null) {
        counter.textContent = `Vídeo ${rightIdx + 1} de ${videos.length}`;
    } else if (leftIdx !== null) {
        counter.textContent = `Vídeo ${leftIdx + 1} de ${videos.length} · Fin del libro`;
    } else {
        counter.textContent = '';
    }
}

// ── NEXT ──────────────────────────────────────────────────────────────────────
function nextPage() {
    if (isAnimating || pagesTurned >= totalSheets) return;

    const { rightIdx } = getSpread(pagesTurned);
    if (rightIdx === null) return;   // nada que girar

    isAnimating = true;

    // La hoja animada:
    //   frente  = lo que actualmente se ve en la derecha (rightIdx)
    //   reverso = el siguiente vídeo (rightIdx + 1), que pasará a la izquierda
    const frontIdx = rightIdx;
    const backIdx  = rightIdx + 1 < videos.length ? rightIdx + 1 : null;

    applyToEl(ffVideo, ffLabel, null, frontIdx);
    applyToEl(fbVideo, fbLabel, null, backIdx);

    // La hoja empieza sin girar (cubre la página derecha)
    flipPage.style.transition = 'none';
    flipPage.classList.remove('flipping');
    void flipPage.offsetWidth;

    // Lanza la animación de giro
    flipPage.style.transition = 'transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1)';
    flipPage.classList.add('flipping');

    // A mitad del giro actualiza las páginas estáticas (quedan ocultas bajo la hoja)
    setTimeout(() => {
        pagesTurned++;
        renderSpread();
    }, 450);

    // Fin del giro: oculta la hoja animada
    setTimeout(() => {
        flipPage.classList.remove('flipping');
        flipPage.style.transition = 'none';
        ffVideo.src = '';
        fbVideo.src = '';
        isAnimating = false;
    }, 920);
}

// ── PREV ──────────────────────────────────────────────────────────────────────
function prevPage() {
    if (isAnimating || pagesTurned === 0) return;
    isAnimating = true;

    // Tras decrementar, la hoja que "vuelve" tiene:
    //   frente  = (pagesTurned-1)*2      → nuevo rightIdx
    //   reverso = (pagesTurned-1)*2 + 1  → leftIdx actual
    const newRight = (pagesTurned - 1) * 2;
    const curLeft  = pagesTurned * 2 - 1;

    const frontIdx = newRight < videos.length ? newRight : null;
    const backIdx  = curLeft  < videos.length ? curLeft  : null;

    applyToEl(ffVideo, ffLabel, null, frontIdx);
    applyToEl(fbVideo, fbLabel, null, backIdx);

    // La hoja ya aparece girada (mostrando el reverso = izquierda actual)
    flipPage.style.transition = 'none';
    flipPage.classList.add('flipping');
    void flipPage.offsetWidth;

    // Animación inversa: la hoja se "desdobla" hacia la derecha
    flipPage.style.transition = 'transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1)';
    flipPage.classList.remove('flipping');

    // A mitad del giro actualiza las páginas estáticas
    setTimeout(() => {
        pagesTurned--;
        renderSpread();
    }, 450);

    // Fin
    setTimeout(() => {
        flipPage.style.transition = 'none';
        ffVideo.src = '';
        fbVideo.src = '';
        isAnimating = false;
    }, 920);
}

// ── INIT ─────────────────────────────────────────────────────────────────────
renderSpread();

// ─── PARTÍCULAS ──────────────────────────────────────────────────────────────
const particleContainer = document.getElementById('particles');
const emojis = ['🍃','✨','🐦','🌸','🍂','⭐','🌿'];
function spawnParticle() {
    const el = document.createElement('div');
    el.className = 'particle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (Math.random() * 18 + 12) + 'px';
    const dur = Math.random() * 6 + 8;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = '0s';
    particleContainer.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000);
}
setInterval(spawnParticle, 500);

// ─── ESTRELLAS ───────────────────────────────────────────────────────────────
const starsContainer = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
        width: ${size}px; height: ${size}px;
        left: ${Math.random()*100}vw;
        top: ${Math.random()*100}vh;
        --d: ${Math.random()*3+2}s;
        animation-delay: ${Math.random()*4}s;
    `;
    starsContainer.appendChild(s);
}
</script>
