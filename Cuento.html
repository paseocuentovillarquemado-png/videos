<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Paseo de Cuento – Villarquemado</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --pink:       #e8547a;
            --pink-dark:  #b33059;
            --gold:       #d4a843;
            --gold-light: #f0d080;
            --cream:      #fdf8ef;
            --parchment:  #f5ead6;
            --forest:     #2d5a27;
            --ink:        #3a2618;
            --page-w: 420px;
            --page-h: 580px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            color: var(--ink);
            background: #1a1a2e;
            overflow-x: hidden;
            cursor: none;
        }

        /* ── CURSOR MÁGICO ── */
        #magic-cursor {
            position: fixed;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(240,208,128,0.9), rgba(212,168,67,0.3));
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease, width 0.2s ease, height 0.2s ease;
            box-shadow: 0 0 12px rgba(212,168,67,0.6), 0 0 24px rgba(212,168,67,0.3);
        }
        #magic-cursor.hovering {
            width: 36px; height: 36px;
            background: radial-gradient(circle, rgba(232,84,122,0.8), rgba(179,48,89,0.2));
            box-shadow: 0 0 16px rgba(232,84,122,0.7), 0 0 32px rgba(232,84,122,0.3);
        }
        #cursor-trail {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
        }
        .trail-dot {
            position: fixed;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(240,208,128,0.5);
            pointer-events: none;
            transform: translate(-50%,-50%);
            animation: trailFade 0.5s forwards;
        }
        @keyframes trailFade {
            to { opacity: 0; transform: translate(-50%,-50%) scale(0); }
        }

        /* ── FONDO ── */
        .bg-layer {
            position: fixed; inset: 0; z-index: -2;
            background: linear-gradient(160deg, #0d1b2a 0%, #1b2838 40%, #2d1f3d 100%);
        }
        .bg-forest {
            position: fixed; inset: 0; z-index: -1;
            background: url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&q=60&w=1200') center/cover;
            opacity: 0.18;
            filter: saturate(0.4) brightness(0.7);
        }
        .stars {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; overflow: hidden;
        }
        .star {
            position: absolute; border-radius: 50%; background: white;
            animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
        }
        @keyframes twinkle { from { opacity: 0.2; transform: scale(1); } to { opacity: 1; transform: scale(1.4); } }
        #particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .particle {
            position: absolute;
            animation: drift linear infinite;
        }
        @keyframes drift {
            0%   { transform: translateY(-5vh) rotate(0deg) translateX(0);   opacity: 0; }
            8%   { opacity: 1; }
            100% { transform: translateY(105vh) rotate(400deg) translateX(30px); opacity: 0; }
        }

        /* ── ANIMACIONES DE ENTRADA ── */
        .fade-in-up {
            opacity: 0; transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .fade-in-up.visible { opacity: 1; transform: translateY(0); }
        .fade-in-up.delay-1 { transition-delay: 0.15s; }
        .fade-in-up.delay-2 { transition-delay: 0.3s; }
        .fade-in-up.delay-3 { transition-delay: 0.45s; }
        .fade-in-up.delay-4 { transition-delay: 0.6s; }

        header {
            position: relative; z-index: 5;
            text-align: center;
            padding: 60px 20px 30px;
        }
        .header-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
            color: #5a3a00;
            font-family: 'Nunito', sans-serif; font-weight: 700;
            font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase;
            padding: 6px 20px; border-radius: 50px; margin-bottom: 18px;
            position: relative; overflow: hidden;
        }
        .header-badge::after {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer { 0%{left:-100%} 50%{left:150%} 100%{left:150%} }
        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3.5rem, 10vw, 6.5rem);
            color: var(--gold-light); line-height: 1.1;
            text-shadow: 0 0 40px rgba(212,168,67,0.5), 0 2px 0 rgba(0,0,0,0.4);
            animation: titleGlow 4s ease-in-out infinite alternate;
        }
        @keyframes titleGlow {
            from { text-shadow: 0 0 30px rgba(212,168,67,0.4), 0 2px 0 rgba(0,0,0,0.4); }
            to   { text-shadow: 0 0 60px rgba(212,168,67,0.8), 0 0 80px rgba(212,168,67,0.3), 0 2px 0 rgba(0,0,0,0.4); }
        }
        .subtitle {
            font-family: 'Playfair Display', serif; font-style: italic;
            font-size: 1.1rem; color: rgba(255,255,255,0.65);
            margin-top: 12px; letter-spacing: 0.05em;
        }
        .ornament {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin: 30px auto;
            color: var(--gold); font-size: 1.2rem;
            position: relative; z-index: 5;
        }
        .ornament::before, .ornament::after {
            content: ''; flex: 1; max-width: 120px; height: 1px;
        }
        .ornament::before { background: linear-gradient(to right, transparent, var(--gold)); }
        .ornament::after  { background: linear-gradient(to left, transparent, var(--gold)); }

        /* ── LIBRO ── */
        .book-title {
            text-align: center; position: relative; z-index: 5; margin-bottom: 20px;
        }
        .book-title h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem; color: var(--gold-light); font-weight: 400;
        }

        .scene {
            display: flex; justify-content: center; align-items: center;
