<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un paseo de Cuento - Villarquemado</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bosque-oscuro: #0a1a0a;
            --bosque-magico: #1a3a1a;
            --oro-teatro: #d4af37;
            --oro-brillo: #ffe55c;
            --oro-oscuro: #8a6311;
            --texto-claro: #fdfaf0;
            --sombra-magica: 0 0 30px rgba(255, 229, 92, 0.3);
            --color-puerta: #1034a6; /* Color inicial (Cenicienta) */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Fredoka', sans-serif;
            color: var(--texto-claro);
            overflow-x: hidden;
            background-color: var(--bosque-oscuro);
        }

        /* FONDO ILUSTRADO FIJO */
        .bg-illustration {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background-image: url('fondo.png'); 
            background-size: cover; background-position: center bottom;
            background-attachment: fixed;
            filter: saturate(1.2) contrast(1.05);
        }

        .bg-illustration::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(10, 26, 10, 0.1), rgba(10, 26, 10, 0.6) 50%, rgba(5, 15, 5, 0.95) 100%);
            z-index: 1;
        }

        /* Partículas */
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        .star { position: absolute; background: rgba(255, 250, 200, 0.8); border-radius: 50%; box-shadow: 0 0 5px rgba(255, 250, 200, 0.5); animation: twinkle 4s ease-in-out infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(1) translateY(0); } 50% { opacity: 1; transform: scale(1.3) translateY(-5px); } }

        h1, h2, h3 { font-family: 'Cinzel', serif; color: var(--oro-teatro); text-shadow: 2px 2px 6px rgba(0,0,0,0.9); }
        .magic-divider { width: 100%; height: 60px; position: relative; margin: 60px 0; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .magic-divider::before { content: ''; position: absolute; width: 100%; height: 2px; background: linear-gradient(to right, transparent, var(--oro-teatro), transparent); }
        .magic-divider::after { content: '✦'; font-size: 2rem; color: var(--oro-brillo); text-shadow: 0 0 20px var(--oro-brillo); padding: 0 20px; z-index: 1; animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Header Hero */
        header { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; position: relative; z-index: 10; }
        .title-pop { font-size: clamp(3rem, 10vw, 7rem); margin: 0; color: #fff; text-shadow: 0 0 20px var(--oro-teatro), 0 0 40px var(--bosque-oscuro); animation: latidoMagico 3s ease-in-out infinite; letter-spacing: 5px; }
        @keyframes latidoMagico { 0%, 100% { text-shadow: 0 0 20px var(--oro-teatro), 0 0 40px var(--bosque-oscuro); transform: scale(1); } 50% { text-shadow: 0 0 30px var(--oro-brillo), 0 0 60px var(--oro-teatro); transform: scale(1.02); } }
        .subtitle { font-size: clamp(1.2rem, 4vw, 2rem); margin: 20px 0 40px; color: var(--oro-brillo); font-family: 'Cinzel', serif; letter-spacing: 3px; }
        .scroll-indicator { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); animation: bounce 2s infinite; }
        .scroll-indicator::before { content: '↓'; font-size: 2rem; color: var(--oro-brillo); text-shadow: 0 0 10px var(--bosque-oscuro); }
        @keyframes bounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(10px); } }

        .btn-magic { background: linear-gradient(135deg, var(--oro-brillo), var(--oro-teatro)); color: #111; border: 3px solid #fff; padding: 15px 35px; border-radius: 50px; font-size: 1.1rem; font-weight: 800; cursor: pointer; text-decoration: none; font-family: 'Cinzel', serif; display: inline-block; box-shadow: var(--sombra-magica); transition: all 0.3s; }
        .btn-magic:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 10px 30px rgba(255, 229, 92, 0.6); }

        /* PUERTA MÁGICA SECUENCIAL */
        .puerta-section { padding: 80px 20px; position: relative; z-index: 10; max-width: 1200px; margin: 0 auto; text-align: center; }
        .puerta-intro { max-width: 700px; margin: 0 auto 40px; font-size: 1.2rem; line-height: 1.8; color: #eee; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
        .marco-puerta { position: relative; width: 100%; max-width: 360px; margin: 0 auto 20px; aspect-ratio: 9 / 16; padding: 15px; background: linear-gradient(135deg, var(--oro-brillo), var(--oro-teatro), var(--oro-oscuro), var(--oro-teatro)); border-radius: 200px 200px 15px 15px; perspective: 1200px; box-shadow: 0 40px 60px rgba(0,0,0,0.9), inset 0 0 15px rgba(255,255,255,0.5), 0 0 50px rgba(212,175,55,0.3); }
        .hueco-puerta { position: relative; width: 100%; height: 100%; background: #000; border-radius: 185px 185px 8px 8px; box-shadow: inset 0 0 40px rgba(0,0,0,0.9); transform-style: preserve-3d; }
        .hoja-puerta { position: absolute; top: 0; width: 50%; height: 100%; background: linear-gradient(180deg, var(--color-puerta) 0%, #111 100%); border: 2px solid var(--oro-oscuro); z-index: 20; transition: transform 1.8s cubic-bezier(0.645, 0.045, 0.355, 1); background-image: repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(0,0,0,0.2) 15px, rgba(0,0,0,0.2) 16px); }
        .hoja-izquierda { left: 0; border-radius: 185px 0 0 8px; transform-origin: left center; border-right: 2px solid #000; }
        .hoja-derecha { right: 0; border-radius: 0 185px 8px 0; transform-origin: right center; border-left: 2px solid rgba(255,255,255,0.2); }
        .hoja-puerta::after { content: ''; position: absolute; top: 50%; width: 12px; height: 25px; background: var(--oro-brillo); border-radius: 10px; }
        .hoja-izquierda::after { right: 10px; } .hoja-derecha::after { left: 10px; }
        .puerta-abierta .hoja-izquierda { transform: rotateY(-110deg); }
        .puerta-abierta .hoja-derecha { transform: rotateY(110deg); }
        .click-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-direction: column; border-radius: 185px 185px 8px 8px; transition: opacity 0.3s; }
        .toque-texto { font-family: 'Cinzel', serif; font-size: 1.5rem; color: #fff; text-shadow: 0 2px 10px #000; text-align: center; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; border: 1px solid var(--oro-teatro); animation: flotarBoton 2s ease-in-out infinite; }
        @keyframes flotarBoton { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .titulo-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 10; opacity: 0; transition: opacity 1s ease; border-radius: 185px 185px 8px 8px; }
        .titulo-overlay h3 { font-size: 2rem; color: var(--oro-brillo); text-align: center; }
        .hueco-puerta video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 185px 185px 8px 8px; z-index: 5; }
        .contador-cuento { margin-top: 10px; font-size: 1.2rem; color: var(--oro-brillo); font-family: 'Cinzel', serif; letter-spacing: 2px; }
        
        .contenedor-saltar { margin-top: 20px; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        .btn-saltar { background: rgba(0,0,0,0.6); border: 2px solid var(--oro-teatro); color: var(--oro-brillo); padding: 10px 25px; font-family: 'Cinzel', serif; border-radius: 30px; cursor: pointer; transition: all 0.3s; }
        .btn-saltar:hover { background: var(--oro-teatro); color: #000; transform: scale(1.05); }

        /* INFO GRID */
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; padding: 80px 5%; position: relative; z-index: 10; max-width: 1400px; margin: 0 auto; }
        .info-card { background: linear-gradient(135deg, rgba(15, 30, 15, 0.8), rgba(20, 40, 20, 0.9)); backdrop-filter: blur(12px); padding: 40px; border-radius: 20px; border: 2px solid rgba(212, 175, 55, 0.4); box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
        .info-card h3 { font-size: 1.8rem; margin-bottom: 20px; color: var(--oro-brillo); }
        .info-card ul { padding-left: 25px; line-height: 2; font-size: 1.05rem; }
        .special-poster { border: 3px dashed var(--oro-brillo); padding: 20px; margin-top: 20px; background: rgba(212, 175, 55, 0.1); border-radius: 10px; }

        /* MAPA (GOOGLE MAPS) */
        .map-section { padding: 80px 20px; text-align: center; position: relative; z-index: 10; }
        .map-section h2 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 50px; }
        .map-container { max-width: 900px; margin: 0 auto; border: 12px solid var(--oro-teatro); padding: 5px; background: rgba(10,20,10,0.8); border-radius: 15px; overflow: hidden; box-shadow: var(--sombra-magica); }
        .map-container iframe { width: 100%; height: 450px; border: 0; display: block; filter: grayscale(0.3) contrast(1.1) brightness(0.9); }

        /* MAKING OFF CON IFRAME EXTERNO */
        .making-off { padding: 100px 20px; background: linear-gradient(180deg, rgba(10,20,10,0.6), rgba(5,10,5,0.98)); border-top: 3px solid var(--oro-teatro); position: relative; z-index: 10; text-align: center; }
        .making-off h2 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 30px; }
        .making-off > p { font-size: 1.1rem; line-height: 1.8; max-width: 750px; margin: 0 auto 50px; color: #ddd; }
        
        /* Contenedor del iFrame para la web de WordPress */
        .iframe-container {
            max-width: 1000px;
            margin: 40px auto 0;
            border: 6px solid var(--oro-teatro
